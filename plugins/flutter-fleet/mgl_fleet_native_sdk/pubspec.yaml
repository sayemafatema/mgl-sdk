name: mgl_fleet_native_sdk
description: Flutter bridge to MGL Fleet native SDK — full driver UI parity (login, PIN, invite, scan, receipt) on Android and iOS.
version: 0.5.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.mgl.fleet.flutter
        pluginClass: MglFleetNativeSdkPlugin
      ios:
        pluginClass: MglFleetNativeSdkPlugin
