android.useAndroidX=true

# Kotlin + Compose: default 512m heap triggers GC thrashing / daemon kills (Android Studio Gradle sync / assembleDebug).
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx2048m

# Bump together with bridges — see docs/VERSIONS.md
fleetAndroid.version=0.1.0

# Optional POM overrides before Maven Central publish (replace YOUR_ORG)
# fleetAndroid.pom.url=https://github.com/your-org/mgl-sdk
# fleetAndroid.pom.developerId=
# fleetAndroid.pom.developerName=

# GPG signing for Maven Central (see docs/PUBLISH_FOR_EXTERNAL_CONSUMERS.md)
# signing.keyId=
# signing.password=
# signing.secretKeyRingFile=
